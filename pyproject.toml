[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kickframe"
version = "0.1.0"
description = "Beat-synced geometric visualizers and cover art for techno tracks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pycairo>=1.23"]

[project.scripts]
kickframe = "kickframe.cli:main"

[tool.setuptools]
packages = ["kickframe"]
